<!-- Polvere di stelle sullo sfondo della cover, come nell'anteprima social (R/social-card.html):

<style>
.stelle-cover { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.stelle-cover .piano { position: absolute; inset: -40px; }
.stelle-cover .piano.lontano { animation: stelle-deriva 140s ease-in-out infinite alternate; }
.stelle-cover .piano.vicino { animation: stelle-deriva 90s ease-in-out infinite alternate-reverse; }
.stelle-cover span {
  position: absolute; border-radius: 50%; background: #fff;
  animation: stelle-tremolio var(--t) ease-in-out var(--r) infinite alternate,
             stelle-vaga var(--v) ease-in-out var(--r) infinite alternate;
}
/* ogni stellina vaga per conto suo attorno alla propria posizione */
@keyframes stelle-vaga {
  0%   { transform: translate(0, 0); }
  33%  { transform: translate(var(--x1), var(--y1)); }
  66%  { transform: translate(var(--x2), var(--y2)); }
  100% { transform: translate(var(--x3), var(--y3)); }
}
@keyframes stelle-tremolio { from { opacity: var(--o); } to { opacity: calc(var(--o) * 0.4); } }
@keyframes stelle-deriva { from { transform: translate(0, 0); } to { transform: translate(34px, -22px); } }
@media (prefers-reduced-motion: reduce) {
  .stelle-cover .piano, .stelle-cover span { animation: none; opacity: var(--o); }
}
</style>

        'px;height:' + z.toFixed(1) + 'px;--o:' + o.toFixed(2) + ';box-shadow:0 0 ' + (z * 4).toFixed(1) +
        'px rgba(255,220,255,' + o.toFixed(2) + ');--t:' + (1.6 + r() * 4.4).toFixed(1) + 's;--r:-' + (r() * 6).toFixed(1) + 's;--v:' + (5 + r() * 9).toFixed(1) + 's' +

        var raggio = 12 + Math.random() * 12, fuga = 55 + Math.random() * 35;
        var durata = 6500 + Math.random() * 2500;
        coppia.forEach(function (p, indice) {

          var cx = dx * lato / 2, cy = dy * lato / 2;

      setTimeout(incontro, 2500 + Math.random() * 3500);

    ultimoSegno = ora;

  }
  aggancia();
})();

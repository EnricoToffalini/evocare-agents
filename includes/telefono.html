<!-- Telefono in verticale: sotto activation-width (index.qmd, scroll-view) reveal impila le slide
     in una pagina da scorrere. Lì ogni slide con frammenti resterebbe ferma per un'intera schermata
     a ogni passo; meglio mostrarla già nello stato finale, così tutte le slide sono compatte. -->
<script>
(function () {
  function completa() {
    if (!Reveal.isScrollView || !Reveal.isScrollView()) return;
    var fr = document.querySelectorAll('.reveal .slides .fragment');
    if (!fr.length) return;
    fr.forEach(function (el) {
      // stato finale: quello che a fine slide sparisce resta nascosto, il resto si vede
      if (/\b(fade-out|current-visible|fade-in-then-out)\b/.test(el.className)) el.style.display = 'none';
      el.classList.remove('fragment');
    });
    Reveal.layout();
  }
  // Il passaggio da e verso lo scorrimento dipende dalla larghezza della finestra, ma solo quando
  // questa resta stabile: reveal lo ricontrolla a ogni layout, e un restringimento momentaneo
  // (fullscreen, finestra agganciata, schermo esterno che si ricollega) basterebbe a farlo scattare.
  var cfg = Reveal.getConfig(), soglia = cfg.scrollActivationWidth, timer = null, ultimaL = -1;
  function controlla() {
    cfg.scrollActivationWidth = soglia; Reveal.layout(); cfg.scrollActivationWidth = null;
  }
  function stabile() {
    clearTimeout(timer);
    timer = setTimeout(function () {
      var l = window.innerWidth;
      if (l !== ultimaL) { ultimaL = l; return stabile(); }
      controlla();
    }, 450);
  }
  if (typeof soglia === 'number') {
    Reveal.on('ready', function () { cfg.scrollActivationWidth = null; ultimaL = window.innerWidth; });
    if (Reveal.isReady()) { cfg.scrollActivationWidth = null; ultimaL = window.innerWidth; }
    window.addEventListener('resize', stabile);
  }
  Reveal.on('ready', completa);
  Reveal.on('resize', completa);
  if (Reveal.isReady()) completa();
})();
</script>

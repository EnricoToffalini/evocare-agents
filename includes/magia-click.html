<!-- Magia al click: a ogni click succede qualcosa di piccolo, strano e imprevedibile -->
<style>
#magia-click { position: fixed; inset: 0; pointer-events: none; z-index: 2147483000; overflow: hidden; }
#magia-click > * { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform, opacity; }
#magia-click .scintilla { width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; }
#magia-click .stella { font-size: 28px; line-height: 1; margin: -14px 0 0 -14px; }
#magia-click .emoji { font-size: 64px; line-height: 1; margin: -32px 0 0 -32px; }
#magia-click .incantesimo {
  z-index: 1;
  font: italic 700 42px/1 Georgia, "Times New Roman", serif; white-space: nowrap; letter-spacing: 0.04em;
  background: linear-gradient(90deg, #ff5a1f, #e6237e 55%, #7c3aed); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 6px rgba(255,255,255,0.9)) drop-shadow(0 0 14px rgba(255,170,90,0.55));
}
#magia-click .anello { width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 3px solid #e6237e; box-shadow: 0 0 18px rgba(230,35,126,0.6), inset 0 0 12px rgba(124,58,237,0.5); }
#magia-click .fumo { width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; background: radial-gradient(circle, rgba(200,190,220,0.75), rgba(200,190,220,0) 70%); filter: blur(4px); }
#magia-click .volatile { font-size: 76px; line-height: 1; }
@media print { #magia-click { display: none; } }
</style>
<div id="magia-click" aria-hidden="true"></div>
<script>
(function () {
  var strato = document.getElementById('magia-click');
  if (!strato || !Element.prototype.animate) return;
  var colori = ['#ff5a1f', '#e6237e', '#7c3aed', '#ffd166', '#0d9488', '#ffffff'];
  var stelle = ['✦', '✧', '★', '✨', '⋆'];
  var creature = ['🦉', '🦇', '🐈‍⬛', '🐉', '🐌', '🦋', '🕷️'];
  var oggetti = ['🪄', '🔮', '🧹', '⚡', '🕯️', '📜', '🗝️', '🌙', '💫', '🫖'];
  var formule = ['Lumos!', 'Accio CSV!', 'Wingardium Leviosa!', 'Riproducibilis!', 'Expecto Agentum!',
    'Alohomora!', 'Evoca Codex!', 'Finite p-hacking!', 'Rscriptus Maxima!', 'Obliviate cache!',
    'Reparo codice!', 'Revelio errori!', 'Prior Incantato!', 'Accio skill!', 'Nox!',
    // incantesimi in salsa nerd: R, statistica, Open Science
    'Expelliarmus outlier!', 'Expecto Replicatum!', 'Avada Kedataframe!', 'Riddikulus p < .05!',
    'Petrificus set.seed(42)!', 'Protego preregistrazione!', 'Confundo confondenti!', 'Silencio warnings()!',
    'Engorgio N!', 'Reducio dimensioni!', 'Geminio git clone!', 'Tergeo NA!', 'Incendio HARKing!',
    'Alohomora paywall!', 'Obliviate .RData!', 'Crucio Excel!', 'Portus Zenodo!', 'Legilimens codebook!',
    'Imperio tidyverse!', 'Muffliato Reviewer 2!', 'Diffindo train/test!', 'Lumos ORCID!',
    'Specialis Revelio DOI!', 'Expecto Open Data!', 'Priori Informativi!', 
    'Fatto il misfatto: git push!', 'Giuro di non fare p-hacking!',
    // Open Science, riproducibilità, FAIR
    'Accio FAIR!', 'Findabilis! Accessibilis!', 'Interoperabilis! Reusabilis!', 'Expecto Riproducibilis!',
    'Revelio file drawer!', 'Finite Incantatem: paywall!', 'Homenum Revelio: README!', 'Protego CC-BY!',
    'Accio codice e dati!', 'Episkey replication crisis!', 'Reparo renv.lock!', 'Priori Incantatem: commit!',
    'Lumos Registered Report!', 'Alohomora OSF!', 'Expelliarmus «dati su richiesta»!', 'Portus PsychArchives!',
    'Geminio replica!', 'Revelio metadati!', 'Specialis Revelio dizionario!', 'Tergeo dati personali!'];
  var rnd = function (a, b) { return a + Math.random() * (b - a); };
  var DURATA = 0.6; // fattore di durata degli effetti: più basso = svaniscono prima
  var pick = function (v) { return v[Math.floor(Math.random() * v.length)]; };

  function crea(cls, x, y, testo) {
    var el = document.createElement('div');
    el.className = cls;
    if (testo) el.textContent = testo;
    el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    strato.appendChild(el);
    return el;
  }
  function anima(el, frames, opt) {
    opt.duration *= DURATA; if (opt.delay) opt.delay *= DURATA;
    var a = el.animate(frames, opt);
    a.onfinish = function () { el.remove(); };
    return a;
  }
  function T(x, y, extra) { return 'translate(' + x + 'px,' + y + 'px) ' + (extra || ''); }

  // 1. Esplosione di scintille colorate
  function scintille(x, y, n) {
    n = n || 26;
    for (var i = 0; i < n; i++) {
      var el = crea('scintilla', x, y), ang = rnd(0, 2 * Math.PI), d = rnd(60, 190), c = pick(colori);
      el.style.background = c; el.style.boxShadow = '0 0 10px ' + c;
      anima(el, [
        { transform: T(x, y, 'scale(1)'), opacity: 1 },
        { transform: T(x + Math.cos(ang) * d, y + Math.sin(ang) * d + 40, 'scale(0.2)'), opacity: 0 }
      ], { duration: rnd(600, 1100), easing: 'cubic-bezier(.15,.7,.3,1)' });
    }
  }
  // 2. Pioggia di stelline che cadono
  function stelline(x, y) {
    for (var i = 0; i < 14; i++) {
      var el = crea('stella', x, y, pick(stelle)), dx = rnd(-160, 160);
      el.style.color = pick(colori);
      anima(el, [
        { transform: T(x, y, 'rotate(0) scale(0.3)'), opacity: 0 },
        { transform: T(x + dx * 0.5, y - rnd(40, 110), 'rotate(180deg) scale(1.1)'), opacity: 1, offset: 0.35 },
        { transform: T(x + dx, y + rnd(120, 260), 'rotate(' + rnd(360, 720) + 'deg) scale(0.5)'), opacity: 0 }
      ], { duration: rnd(1200, 1800), easing: 'ease-in-out', delay: i * 25 });
    }
  }
  // 3. Un oggetto magico che sale fluttuando
  function oggetto(x, y) {
    var el = crea('emoji', x, y, pick(oggetti)), dx = rnd(-60, 60);
    anima(el, [
      { transform: T(x, y, 'scale(0.2) rotate(-30deg)'), opacity: 0 },
      { transform: T(x, y - 30, 'scale(1.3) rotate(10deg)'), opacity: 1, offset: 0.2 },
      { transform: T(x + dx, y - 140, 'scale(1) rotate(-8deg)'), opacity: 1, offset: 0.7 },
      { transform: T(x + dx * 1.5, y - 220, 'scale(0.6) rotate(20deg)'), opacity: 0 }
    ], { duration: 1800, easing: 'ease-out' });
    scintille(x, y, 10);
  }
  // 4. Una formula magica scritta nell'aria
  function incantesimo(x, y) {
    var el = crea('incantesimo', x, y, pick(formule));
    var w = el.offsetWidth, x0 = Math.min(Math.max(x - w / 2, 10), innerWidth - w - 10);
    anima(el, [
      { transform: T(x0, y - 20, 'scale(0.6)'), opacity: 0, filter: 'blur(6px)' },
      { transform: T(x0, y - 60, 'scale(1.05)'), opacity: 1, filter: 'blur(0)', offset: 0.2 },
      { transform: T(x0, y - 80, 'scale(1)'), opacity: 1, offset: 0.75 },
      { transform: T(x0, y - 130, 'scale(1.1)'), opacity: 0, filter: 'blur(4px)' }
    ], { duration: 2200, easing: 'ease-out' });
    scintille(x, y, 12);
  }
  // 5. Onde concentriche
  function onde(x, y) {
    for (var i = 0; i < 3; i++) {
      var el = crea('anello', x, y);
      el.style.borderColor = colori[i];
      anima(el, [
        { transform: T(x, y, 'scale(0.3)'), opacity: 0.9 },
        { transform: T(x, y, 'scale(' + (9 + i * 3) + ')'), opacity: 0 }
      ], { duration: 1100, delay: i * 140, easing: 'cubic-bezier(.2,.6,.3,1)' });
    }
  }
  // 6. Una creatura attraversa lo schermo aleggiando, senza rimbalzi
  function creatura(x, y) {
    var el = crea('volatile', 0, 0, pick(creature));
    var verticale = Math.random() < 0.5, avanti = Math.random() < 0.5;
    var limite = verticale ? innerHeight : innerWidth;
    var inizio = avanti ? -100 : limite + 100, fine = avanti ? limite + 100 : -100;
    var centro = verticale ? Math.max(80, Math.min(innerWidth - 160, x)) : Math.max(80, Math.min(innerHeight - 160, y));
    var flip = !verticale && avanti ? 'scaleX(-1)' : '';
    var ampiezza = rnd(40, 60);
    var frames = [];
    for (var i = 0; i <= 80; i++) {
      var p = i / 80, onda = Math.sin(p * 3 * Math.PI);
      var posizione = inizio + (fine - inizio) * p, deriva = centro + ampiezza * onda;
      frames.push({
        transform: T(verticale ? deriva : posizione, verticale ? posizione : deriva, flip + ' rotate(' + (5 * onda) + 'deg)'),
        offset: p
      });
    }
    anima(el, frames, { duration: rnd(3000, 4000), easing: 'linear' });
    scintille(x, y, 8);
  }
  // 7. Sbuffo di fumo: qualcosa è stato evocato... e svanisce
  function fumo(x, y) {
    for (var i = 0; i < 9; i++) {
      var el = crea('fumo', x, y), dx = rnd(-70, 70), dy = rnd(-90, 10);
      anima(el, [
        { transform: T(x, y, 'scale(0.3)'), opacity: 0.9 },
        { transform: T(x + dx, y + dy, 'scale(' + rnd(1.8, 3) + ')'), opacity: 0 }
      ], { duration: rnd(900, 1500), easing: 'ease-out' });
    }
    var e = crea('emoji', x, y, pick(creature.concat(oggetti)));
    anima(e, [
      { transform: T(x, y, 'scale(0)'), opacity: 0 },
      { transform: T(x, y - 10, 'scale(1.2)'), opacity: 1, offset: 0.3 },
      { transform: T(x, y - 10, 'scale(1)'), opacity: 1, offset: 0.7 },
      { transform: T(x, y - 10, 'scale(0)'), opacity: 0 }
    ], { duration: 1400, easing: 'ease-in-out' });
  }
  // 8. Qualche elemento della slide trema, come scosso da un incantesimo
  function tremito(x, y) {
    var v = elementiSlide().sort(function () { return Math.random() - 0.5; }).slice(0, 2 + Math.floor(Math.random() * 3));
    v.forEach(function (s) { s.animate([
      { translate: '0 0', rotate: '0deg' }, { translate: '-6px 2px', rotate: '-0.4deg' },
      { translate: '5px -2px', rotate: '0.4deg' }, { translate: '-3px 1px', rotate: '-0.2deg' },
      { translate: '0 0', rotate: '0deg' }
    ], { duration: 450, easing: 'ease-in-out' }); });
    stelline(x, y);
  }
  // 9. I colori impazziscono per un attimo
  function arcobaleno(x, y) {
    var r = document.querySelector('.reveal');
    if (r) r.animate([
      { filter: 'hue-rotate(0deg) saturate(1)' }, { filter: 'hue-rotate(180deg) saturate(1.6)', offset: 0.4 },
      { filter: 'hue-rotate(360deg) saturate(1)' }
    ], { duration: 1000 * DURATA, easing: 'ease-in-out' });
    onde(x, y);
  }
  // 10. Levitazione: l'elemento cliccato si solleva e torna giù
  function levita(x, y, target) {
    var t = target && target.closest && target.closest('.reveal .slides section img, .reveal .slides section h2, .reveal .slides section li, .reveal .slides section p, .reveal .slides section .term, .reveal .slides section blockquote');
    if (!t || t.closest('pre, code')) return incantesimo(x, y);
    t.animate([
      { translate: '0 0', rotate: '0deg' }, { translate: '0 -28px', rotate: '-1.5deg', offset: 0.4 },
      { translate: '0 -22px', rotate: '1.5deg', offset: 0.7 }, { translate: '0 0', rotate: '0deg' }
    ], { duration: 1500 * DURATA, easing: 'ease-in-out' });
    var el = crea('incantesimo', x, y, 'Wingardium Leviosa!'), w = el.offsetWidth;
    var x0 = Math.min(Math.max(x - w / 2, 10), innerWidth - w - 10);
    anima(el, [
      { transform: T(x0, y - 40), opacity: 0 }, { transform: T(x0, y - 80), opacity: 1, offset: 0.25 },
      { transform: T(x0, y - 120), opacity: 0 }
    ], { duration: 1600, easing: 'ease-out' });
  }
  // Elementi visibili della slide corrente (per gli effetti che li muovono)
  function elementiSlide() {
    var s = window.Reveal && Reveal.getCurrentSlide && Reveal.getCurrentSlide();
    if (!s) return [];
    return Array.prototype.filter.call(s.querySelectorAll('h2, p, li, img, .term, blockquote, .prompt, table'), function (el) {
      return !el.closest('.fragment:not(.visible), pre, aside') && el.offsetWidth > 0;
    }).slice(0, 14);
  }
  // 11. Gli elementi della slide fanno un saltello, uno dopo l'altro
  function danza(x, y) {
    var v = elementiSlide();
    if (!v.length) return onde(x, y);
    v.forEach(function (el, i) {
      el.animate([
        { translate: '0 0', rotate: '0deg' }, { translate: '0 -16px', rotate: (i % 2 ? 1.5 : -1.5) + 'deg', offset: 0.45 },
        { translate: '0 0', rotate: '0deg' }
      ], { duration: 420, delay: i * 55, easing: 'ease-in-out' });
    });
    scintille(x, y, 8);
  }
  // 12. Lampo di colori: tre scatti rapidi di tinta
  function lampo(x, y) {
    var r = document.querySelector('.reveal');
    if (r) r.animate([
      { filter: 'none' }, { filter: 'hue-rotate(110deg) saturate(2)', offset: 0.2 },
      { filter: 'hue-rotate(240deg) saturate(2.2)', offset: 0.45 }, { filter: 'hue-rotate(320deg) saturate(1.6) brightness(1.15)', offset: 0.7 },
      { filter: 'none' }
    ], { duration: 520, easing: 'steps(1, end)' });
    scintille(x, y, 10);
  }
  // 13. La slide respira: un piccolo pulsare con una leggera torsione
  function respiro(x, y) {
    var s = document.querySelector('.reveal .slides');
    if (s) s.animate([
      { scale: '1', rotate: '0deg' }, { scale: '1.035', rotate: '-0.6deg', offset: 0.35 },
      { scale: '0.99', rotate: '0.3deg', offset: 0.7 }, { scale: '1', rotate: '0deg' }
    ], { duration: 650, easing: 'ease-in-out' });
    onde(x, y);
  }
  // Rarissimo: tutto insieme
  function jackpot(x, y) {
    scintille(x, y, 60); onde(x, y); stelline(x, y);
    setTimeout(function () { incantesimo(x, y); creatura(x, y); }, 250 * DURATA);
  }

  // incantesimo, arcobaleno e lampo compaiono due volte: escono più spesso
  var magie = [scintille, stelline, oggetto, onde, creatura, fumo, tremito, arcobaleno, arcobaleno, levita, danza, lampo, lampo, respiro];
  var ultima = null;
  document.addEventListener('click', function (e) {
    if (e.button !== 0 || !e.isTrusted) return;
    var t = e.target;
    if (t.closest && t.closest('.controls, .slide-menu, input, textarea, select, [contenteditable="true"]')) return;
    if (Math.random() < 0.04) return jackpot(e.clientX, e.clientY);
    var i;
    do { i = Math.floor(Math.random() * magie.length); } while (magie[i] === ultima);
    ultima = magie[i];
    magie[i](e.clientX, e.clientY, t);
    // Con levitazione e jackpot, il 44% aggiuntivo porta le formule a circa il 50% dei click.
    var x = e.clientX, y = e.clientY;
    if (ultima !== levita && Math.random() < 0.44)
      setTimeout(function () { incantesimo(x, y); }, 180 * DURATA);
  }, true);
})();
</script>
